{# Small, shared keepsake icons. Labels stay in visible text; the art is decorative. #}
{% macro icon(name, extra='') -%}
<svg class="love-icon {{ extra }}" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{% if name=='star' %}
<path class="icon-petal" d="m16 3 4.1 8.2 9 1.3-6.5 6.4 1.5 9-8.1-4.3-8.1 4.3 1.5-9L3 12.5l9-1.3Z"/>
<path d="M12.5 15v1m7-1v1m-6 3q2.5 2.5 5 0"/><path class="icon-blush" d="M10 18h1m10 0h1"/>
{% elif name=='heart' %}
<path class="icon-petal" d="M16 27C13 24 4 18 4 11a6.7 6.7 0 0 1 12-4 6.7 6.7 0 0 1 12 4c0 7-9 13-12 16Z"/>
<path d="M12 13v1m8-1v1m-6 4q2 2 4 0"/><path class="icon-blush" d="M9 16h1m12 0h1"/>
{% elif name=='journal' %}
<rect class="icon-petal" x="7" y="5" width="20" height="23" rx="5"/><path d="M11 5v23M5 10h4M5 16h4M5 22h4"/><path d="M19 13c-3-3-6 1-3 3l3 3 3-3c3-2 0-6-3-3Z"/>
{% elif name=='calendar' %}
<rect class="icon-petal" x="4" y="6" width="24" height="23" rx="5"/><path d="M10 3v6m12-6v6M4 13h24"/><path d="M16 18c-3-3-6 1-3 3l3 3 3-3c3-2 0-6-3-3Z"/>
{% elif name=='letter' %}
<rect class="icon-petal" x="3" y="9" width="26" height="19" rx="5"/><path d="m4 11 10 8q2 1.5 4 0l10-8M4 26l8-8m16 8-8-8"/><path class="icon-paper" d="M16 15c-2-2-7-5-7-8a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 3-5 6-7 8Z"/>
{% elif name=='wish' %}
<path class="icon-petal" d="m17 4 3.5 7 7.5 1-5.5 5.5 1.5 7.5-7-3.5-7 3.5 1.5-7.5L6 12l7.5-1Z"/><path d="m4 23 4-4m-3 10 5-5m-8-7 4-4M15 14v1m5-1v1m-4 3q1.5 1 3 0"/>
{% elif name=='couple' %}
<path class="icon-petal" d="M4 26v-4a6 6 0 0 1 12 0v4Zm12 0v-4a6 6 0 0 1 12 0v4Z"/><circle class="icon-paper" cx="10" cy="11" r="5"/><circle class="icon-paper" cx="22" cy="11" r="5"/><path d="m14 3 2 2 2-2M9 11h.1m13-.1h.1"/>
{% elif name=='flower' %}
<path class="icon-petal" d="M16 8c-6-10-14-1-7 5-10 2-6 13 3 9 0 11 12 11 12 1 9 1 10-10 1-12 3-9-7-12-9-3Z"/><circle class="icon-paper" cx="17" cy="16" r="4"/>
{% elif name=='basket' %}
<path class="icon-petal" d="m5 13 3 15h16l3-15Z"/><path d="m10 13 6-9 6 9M3 13h26M12 18v5m8-5v5"/>
{% elif name=='search' %}
<circle class="icon-petal" cx="14" cy="14" r="9"/><path d="m21 21 7 7M10 10q2-2 5-1"/>
{% elif name=='pen' %}
<path class="icon-petal" d="m7 21 15-15q3-3 6 0t0 6L13 27l-8 2Z"/><path d="m20 8 6 6M7 21l6 6M5 29h22"/>
{% endif %}
</svg>
{%- endmacro %}
