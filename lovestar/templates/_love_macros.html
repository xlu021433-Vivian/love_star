{% macro csrf() %}<input type="hidden" name="_csrf" value="{{ csrf_token() }}">{% endmacro %}
{% macro privacy(is_public=false) %}<fieldset class="privacy-choice"><legend>谁可以看见</legend><label class="check-row"><input type="checkbox" name="public" value="1" {% if is_public %}checked{% endif %}><span>公开给访客<small>不勾选时，仅你和伴侣可见。</small></span></label><label class="check-row public-confirm"><input type="checkbox" name="confirm_public" value="1"><span>我确认这条内容可以公开<small>包括文字、日期和附带照片。</small></span></label></fieldset>{% endmacro %}
